services:
  - type: worker
    name: auto-crypto-simulation
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python -u worker.py run
    numInstances: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: RUN_MODE
        value: simulation
    disk:
      name: simulation-state
      mountPath: /var/data
      sizeGB: 1
